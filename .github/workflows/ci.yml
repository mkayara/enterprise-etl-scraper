name: ETL Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium dependencies
        run: python -m playwright install-deps chromium

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Validate Python syntax
        run: python -m py_compile app/main.py app/scrapers/engine.py app/pipelines/etl.py

      - name: Run scraper engine
        run: python app/scrapers/engine.py
