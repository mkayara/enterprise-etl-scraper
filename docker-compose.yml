services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - etl_data:/app/data

  dashboard:
    build: .
    command: streamlit run app/ui/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      - etl_data:/app/data
    depends_on:
      - api

volumes:
  etl_data: